name: biome-check

on:  
  pull_request: 

jobs:
  biome-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome Check
        run: |
          if ! npm run check-format; then
            echo "::error::🚨 Biome check failed! Please fix formatting issues by running 'npm run format' locally.";
            exit 1;
          fi
